name: Release npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm CLI for trusted publishing
        run: bun add --global npm@11.19.0
      - name: Verify trusted publishing npm CLI
        run: $(bun pm bin -g)/npm --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          bun -e 'const p=require("./package.json"); if(process.env.TAG!==`v${p.version}`) throw new Error(`tag ${process.env.TAG} does not match v${p.version}`)'
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Publish with provenance
        if: github.event_name == 'release'
        run: $(bun pm bin -g)/npm publish --access public --provenance
