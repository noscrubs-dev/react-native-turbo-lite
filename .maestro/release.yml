appId: dev.turbolite.example
---
- launchApp:
    clearState: true
- assertVisible: "Turbo Lite release example"
- assertVisible: "Home document"
- assertVisible: "Eager Frame loaded"
- tapOn: "Open details"
- assertVisible: "Details document"
- assertVisible:
    id: "request-count-3"
- back
- assertVisible: "Home document"
- assertVisible:
    id: "request-count-3"
- assertVisible: "Lazy placeholder"
- assertNotVisible: "Lazy Frame loaded from preload"
- tapOn: "Preload lazy Frame"
- assertVisible:
    id: "lazy-frame-preloaded"
- assertVisible: "Lazy placeholder"
- tapOn: "Load lazy Frame"
- assertVisible: "Lazy Frame loaded from preload"
- scrollUntilVisible:
    element:
      text: "Run POST Stream"
    direction: DOWN
- tapOn: "Laundry item"
- inputText: "Towels"
- hideKeyboard
- tapOn: "Run POST Stream"
- assertVisible:
    id: "post-form-pending"
- assertVisible: "Submitting item=Towels"
- assertVisible: "Saved by Stream"
- assertVisible: "Towels"
- assertVisible: "Unknown wrappers keep their children."
- assertVisible:
    id: "last-error-unknown-element"
- scrollUntilVisible:
    element:
      text: "Run GET form"
    direction: UP
- tapOn: "Search query"
- inputText: "shirts"
- hideKeyboard
- tapOn: "Run GET form"
- assertVisible: "GET form result"
- back
- assertVisible: "Home document"
- scrollUntilVisible:
    element:
      text: "Create order"
    direction: DOWN
- tapOn: "Order note"
- inputText: "Leave at reception"
- hideKeyboard
- tapOn: "Create order"
- assertVisible: "Order 42"
- assertVisible:
    id: "request-count-8"
- back
- assertVisible: "Home document"
- assertVisible:
    id: "request-count-8"
